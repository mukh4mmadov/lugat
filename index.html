<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // K-TALIM moved to https://www.ktalim.uz. A browser keeps saved data per address, so the
      // old address sends visitors on with what a guest kept here. Sign-in
      // tokens stay behind, and links from sign-in emails still open here.
      (function () {
        var NEW_SITE = "https://www.ktalim.uz";
        var MARK = "#ktalim-handoff=";
        var CACHES = /^(sb-|k-talim:(word-overrides|voice-map|text-overrides|content-overrides|custom-words|custom-topik|premium-prices|new-version-reload|last-route|show-drafts))/;
        var ON_SERVER = /^(ktalim-1a-progress-v1|ktalim-progress-updated-at|k-talim:topik-attempts:v1)$/;
        function encode(text) {
          var bytes = new TextEncoder().encode(text);
          if (!window.CompressionStream) return Promise.resolve("raw." + encodeURIComponent(text));
          var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
          return new Response(stream).arrayBuffer().then(function (buffer) {
            var binary = "";
            var view = new Uint8Array(buffer);
            for (var i = 0; i < view.length; i += 1) binary += String.fromCharCode(view[i]);
            return "gz." + btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
          });
        }
        function decode(text) {
          if (text.indexOf("raw.") === 0) return Promise.resolve(decodeURIComponent(text.slice(4)));
          var base64 = text.slice(3).replace(/-/g, "+").replace(/_/g, "/");
          var binary = atob(base64);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
          return new Response(stream).text();
        }
        try {
          if (location.hostname === "lugat-six.vercel.app") {
            if (/^\/(auth|reset-password)/.test(location.pathname)) return;
            var target = NEW_SITE + location.pathname + location.search;
            var data = {};
            var signedIn = Boolean(localStorage.getItem("ktalim-progress-owner"));
            for (var i = 0; i < localStorage.length; i += 1) {
              var key = localStorage.key(i);
              if (CACHES.test(key) || (signedIn && ON_SERVER.test(key))) continue;
              data[key] = localStorage.getItem(key);
            }
            // A handoff mark in an incoming link is never passed on: only this
            // browser's own data may travel.
            var hash = location.hash.indexOf(MARK) === 0 ? "" : location.hash;
            if (!Object.keys(data).length) return location.replace(target + hash);
            var leave = function (payload) { location.replace(payload && payload.length < 500000 ? target + MARK + payload : target + hash); };
            encode(JSON.stringify(data)).then(leave, function () { leave(""); });
          } else if (location.hash.indexOf(MARK) === 0) {
            var payload = location.hash.slice(MARK.length);
            history.replaceState(null, "", location.pathname + location.search);
            // Only a move made by the old address is taken in, and only the
            // site's own keys: never sign-in tokens or cached site content.
            if (document.referrer.indexOf("https://lugat-six.vercel.app/") !== 0) return;
            decode(payload).then(function (text) {
              var moved = JSON.parse(text);
              var added = false;
              for (var name in moved) {
                if (!/^(ktalim|k-talim:|language$)/.test(name) || CACHES.test(name) || typeof moved[name] !== "string") continue;
                if (localStorage.getItem(name) === null) {
                  localStorage.setItem(name, moved[name]);
                  added = true;
                }
              }
              if (added) location.reload();
            });
          }
        } catch (error) {
          // Nothing to carry over; the site works without it.
        }
      })();
    </script>

    <style>
      /* Shown by the HTML itself while the app's code downloads; React replaces it. */
      html { background: #f8fafc; color: #020617; }
      html.k-dark { background: #07111f; color: #fff; }
      #splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
      #splash b { font-size: 40px; font-weight: 900; letter-spacing: -0.02em; }
      #splash span { font-size: 16px; opacity: 0.7; }
      #splash i { width: 120px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, #0ea5e9, #8b5cf6); animation: splash 1.2s ease-in-out infinite; }
      @keyframes splash { 50% { opacity: 0.35; transform: scaleX(0.6); } }
    </style>
    <script>
      // The saved light/dark choice, applied before anything paints.
      try {
        var saved = JSON.parse(localStorage.getItem("ktalim-1a-progress-v1") || "{}");
        if ((saved.theme || "dark") === "dark") document.documentElement.classList.add("k-dark");
      } catch (error) {
        document.documentElement.classList.add("k-dark");
      }
    </script>
